version: "2"
run:
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    # Imports this module must never take, in tests too
    # (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3).
    depguard:
      rules:
        forbidden:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/charmbracelet/bubbletea
              desc: "Charm v1: use charm.land/bubbletea/v2 (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3)"
            - pkg: github.com/charmbracelet/lipgloss
              desc: "Charm v1: use charm.land/lipgloss/v2 (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3)"
            - pkg: github.com/charmbracelet/bubbles
              desc: "Charm v1: use charm.land/bubbles/v2 (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3)"
            - pkg: github.com/maccavelli/mcplib
              desc: "this module never imports mcplib (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3)"
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: "this module never imports the MCP go-sdk (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3)"
            - pkg: github.com/maccavelli/go-llmprovider-sdk
              desc: "this module never imports go-llmprovider-sdk (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3)"
            - pkg: charm.land/fang/v2
              desc: "fang is not used, in any module (docs/decisions/0010-MADR-nested-adapter-modules.md Q1)"
            - pkg: github.com/charmbracelet/fang
              desc: "fang is not used, in any module (docs/decisions/0010-MADR-nested-adapter-modules.md Q1)"
            - pkg: github.com/spf13/cobra
              desc: "go-tui-lib imports no CLI framework; a program brings its own (docs/decisions/0012-MADR-bring-your-own-cli.md)"
            - pkg: github.com/spf13/pflag
              desc: "go-tui-lib imports no CLI framework; a program brings its own (docs/decisions/0012-MADR-bring-your-own-cli.md)"
            - pkg: github.com/alecthomas/kong
              desc: "go-tui-lib imports no CLI framework; a program brings its own (docs/decisions/0012-MADR-bring-your-own-cli.md)"
        # A nested module's dependency stays in that module
        # (docs/decisions/0010-MADR-nested-adapter-modules.md §5). depguard
        # matches `files` against each file's absolute, slash-separated path,
        # and a leading "!" excludes a match (depguard v2.2.1, settings.go),
        # so each rule covers every file but the one module that may import
        # the package. The patterns are unanchored: golangci-lint's
        # ${config-path} would put a Windows path's backslashes, glob
        # escapes, into the pattern.
        glamour:
          list-mode: lax
          files:
            - $all
            - "!**/stream/glamourmd/**"
          deny:
            - pkg: charm.land/glamour/v2
              desc: "glamour only in the stream/glamourmd module (docs/decisions/0010-MADR-nested-adapter-modules.md §5)"
        # ultraviolet has no tagged release, so two internal packages hold
        # every use of it (docs/decisions/0004-MADR-integrate-charm-v2-and-go-1-27.md §1;
        # docs/decisions/0005-MADR-terminal-capabilities-and-services.md §1).
        ultraviolet:
          list-mode: lax
          files:
            - $all
            - "!**/internal/cells/**"
            - "!**/internal/termevent/**"
          deny:
            - pkg: github.com/charmbracelet/ultraviolet
              desc: "ultraviolet only in internal/cells and internal/termevent (docs/decisions/0004-MADR-integrate-charm-v2-and-go-1-27.md §1, docs/decisions/0005-MADR-terminal-capabilities-and-services.md §1)"
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocognit:
      min-complexity: 50
    gocritic:
      disabled-checks:
        - paramTypeCombine
        - unnamedResult
        - exitAfterDefer
        - octalLiteral
        - hugeParam
        - rangeValCopy
        - ifElseChain
        - elseif
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 40
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: atomic
        - name: blank-imports
        - name: confusing-naming
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: exported
        - name: package-comments
        - name: var-naming
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - gosec
          - unparam
          - revive
          - gocritic
          - goconst
        path: _test\.go
      - linters:
          - godot
        text: Comment should end in a period
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
