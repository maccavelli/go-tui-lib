version: "2"
run:
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    # Imports this module must never take, in tests too
    # (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3).
    depguard:
      rules:
        forbidden:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/charmbracelet/bubbletea
              desc: "Charm v1: use charm.land/bubbletea/v2 (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3)"
            - pkg: github.com/charmbracelet/lipgloss
              desc: "Charm v1: use charm.land/lipgloss/v2 (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3)"
            - pkg: github.com/charmbracelet/bubbles
              desc: "Charm v1: use charm.land/bubbles/v2 (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3)"
            - pkg: github.com/maccavelli/mcplib
              desc: "this module never imports mcplib (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3)"
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: "this module never imports the MCP go-sdk (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3)"
            - pkg: github.com/maccavelli/go-llmprovider-sdk
              desc: "this module never imports go-llmprovider-sdk (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §3)"
            - pkg: charm.land/fang/v2
              desc: "fang is not used, in any module (docs/decisions/0010-MADR-nested-adapter-modules.md Q1)"
            - pkg: github.com/charmbracelet/fang
              desc: "fang is not used, in any module (docs/decisions/0010-MADR-nested-adapter-modules.md Q1)"
            - pkg: github.com/spf13/cobra
              desc: "go-tui-lib imports no CLI framework; a program brings its own (docs/decisions/0012-MADR-bring-your-own-cli.md)"
            - pkg: github.com/spf13/pflag
              desc: "go-tui-lib imports no CLI framework; a program brings its own (docs/decisions/0012-MADR-bring-your-own-cli.md)"
            - pkg: github.com/alecthomas/kong
              desc: "go-tui-lib imports no CLI framework; a program brings its own (docs/decisions/0012-MADR-bring-your-own-cli.md)"
        # A nested module's dependency stays in that module
        # (docs/decisions/0010-MADR-nested-adapter-modules.md §5). depguard
        # matches `files` against each file's absolute, slash-separated path,
        # and a leading "!" excludes a match (depguard v2.2.1, settings.go),
        # so each rule covers every file but the one module that may import
        # the package. The patterns are unanchored: golangci-lint's
        # ${config-path} would put a Windows path's backslashes, glob
        # escapes, into the pattern.
        glamour:
          list-mode: lax
          files:
            - $all
            - "!**/stream/glamourmd/**"
          deny:
            - pkg: charm.land/glamour/v2
              desc: "glamour only in the stream/glamourmd module (docs/decisions/0010-MADR-nested-adapter-modules.md §5)"
        # ultraviolet has no tagged release, so two internal packages hold
        # every use of it (docs/decisions/0004-MADR-integrate-charm-v2-and-go-1-27.md §1;
        # docs/decisions/0005-MADR-terminal-capabilities-and-services.md §1).
        ultraviolet:
          list-mode: lax
          files:
            - $all
            - "!**/internal/cells/**"
            - "!**/internal/termevent/**"
          deny:
            - pkg: github.com/charmbracelet/ultraviolet
              desc: "ultraviolet only in internal/cells and internal/termevent (docs/decisions/0004-MADR-integrate-charm-v2-and-go-1-27.md §1, docs/decisions/0005-MADR-terminal-capabilities-and-services.md §1)"
        # x/term is a direct requirement for launch alone: only launch asks
        # the terminal for its state
        # (docs/decisions/0013-MADR-cli-integration-helpers.md §11).
        xterm:
          list-mode: lax
          files:
            - $all
            - "!**/launch/**"
          deny:
            - pkg: github.com/charmbracelet/x/term
              desc: "x/term only in launch (docs/decisions/0013-MADR-cli-integration-helpers.md A1, docs/decisions/0014-MADR-native-integration-api.md W1)"
        # The cores link no Charm module but x/ansi, so a line-mode CLI may
        # import them (docs/decisions/0020-MADR-charm-free-cores-glyphs-and-safetext.md
        # D1, D11). Each pattern is one core's own non-test files: depguard
        # compiles it with '/' as the separator, so "*" does not reach a
        # sub-package, such as an adapter. internal/conformance's
        # TestCoresAreCharmFree checks the whole closure; this rule fails a
        # direct import at lint. Keep the two lists the same.
        charmfree:
          list-mode: lax
          files:
            - "**/command/*.go"
            - "**/fuzzy/*.go"
            - "**/glyph/*.go"
            - "**/internal/enum/*.go"
            - "**/internal/sanitize/*.go"
            - "**/keymap/*.go"
            - "**/layout/*.go"
            - "**/safetext/*.go"
            - "**/termcap/*.go"
            - "**/termkey/*.go"
            - "**/termsvc/*.go"
            - "**/when/*.go"
            - "!$test"
          deny:
            - pkg: charm.land/bubbletea/v2
              desc: "no Bubble Tea in a Charm-free core; its form goes in the adapter (docs/decisions/0020-MADR-charm-free-cores-glyphs-and-safetext.md D11)"
            - pkg: charm.land/bubbles/v2
              desc: "no Bubbles in a Charm-free core (docs/decisions/0020-MADR-charm-free-cores-glyphs-and-safetext.md D11)"
            - pkg: charm.land/lipgloss/v2
              desc: "no Lip Gloss in a Charm-free core (docs/decisions/0020-MADR-charm-free-cores-glyphs-and-safetext.md D11)"
            - pkg: github.com/charmbracelet/colorprofile
              desc: "no colorprofile in a Charm-free core (docs/decisions/0020-MADR-charm-free-cores-glyphs-and-safetext.md D11)"
            - pkg: github.com/charmbracelet/ultraviolet
              desc: "no ultraviolet in a Charm-free core (docs/decisions/0020-MADR-charm-free-cores-glyphs-and-safetext.md D11)"
            - pkg: github.com/charmbracelet/x/term
              desc: "no x/term in a Charm-free core (docs/decisions/0020-MADR-charm-free-cores-glyphs-and-safetext.md D11)"
            - pkg: github.com/maccavelli/go-tui-lib/v2/internal/teamsg
              desc: "internal/teamsg imports Bubble Tea: adapters only (docs/decisions/0020-MADR-charm-free-cores-glyphs-and-safetext.md D2, D11)"
        # termkey imports the standard library and internal/enum, and
        # nothing else (docs/decisions/0020-MADR-charm-free-cores-glyphs-and-safetext.md
        # D7; docs/decisions/0021-MADR-termkey-closure-gate.md). internal/conformance's
        # TestNarrowClosures checks the whole closure; this rule fails a
        # direct import at lint. Keep its allow list and narrow's the same.
        termkeystd:
          list-mode: strict
          files:
            - "**/termkey/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/maccavelli/go-tui-lib/v2/internal/enum
        # safetext imports the standard library, glyph and internal/enum, and
        # nothing else (docs/decisions/0020-MADR-charm-free-cores-glyphs-and-safetext.md
        # D9; docs/decisions/0021-MADR-termkey-closure-gate.md A1). internal/conformance's
        # TestNarrowClosures checks the whole closure; this rule fails a
        # direct import at lint. Keep its allow list and narrow's the same.
        safetextstd:
          list-mode: strict
          files:
            - "**/safetext/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/maccavelli/go-tui-lib/v2/glyph
            - github.com/maccavelli/go-tui-lib/v2/internal/enum
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocognit:
      min-complexity: 50
    gocritic:
      disabled-checks:
        - paramTypeCombine
        - unnamedResult
        - exitAfterDefer
        - octalLiteral
        - hugeParam
        - rangeValCopy
        - ifElseChain
        - elseif
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 40
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: atomic
        - name: blank-imports
        - name: confusing-naming
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: exported
        - name: package-comments
        - name: var-naming
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - gosec
          - unparam
          - revive
          - gocritic
          - goconst
        path: _test\.go
      - linters:
          - godot
        text: Comment should end in a period
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
