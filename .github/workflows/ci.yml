name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# One run per ref: a newer push, or a duplicate trigger for the same one,
# cancels the older run
# (go-core-lib docs/decisions/0003-MADR-remediate-debugging-pass-findings.md D11).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go test ./...
      # The race detector needs cgo, which the Linux and macOS runners have
      # (go-core-lib docs/decisions/0003-MADR-remediate-debugging-pass-findings.md D9).
      - name: go test -race
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      # Order-dependent tests fail here (go-core-lib docs/decisions/0004-MADR-evolve-selfupdate-api-and-tui-support.md H7).
      - name: go test -shuffle
        if: runner.os == 'Linux'
        run: go test -shuffle=on -count=2 ./...
      # Terminal code that assumes a UTF-8 locale fails here
      # (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §5).
      - name: go test LC_ALL=C
        if: runner.os == 'Linux'
        env:
          LC_ALL: C
        run: go test -count=1 ./...
      # Targets the matrix does not run: a build-tag gap fails here
      # (go-core-lib docs/decisions/0004-MADR-evolve-selfupdate-api-and-tui-support.md H7).
      - name: cross go vet
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for target in freebsd/amd64 openbsd/amd64 linux/386; do
            echo "go vet ($target)"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
          done
      - name: vet, gofmt, tidy, lint
        if: runner.os == 'Linux'
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
          go mod tidy -diff
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint" make lint
      - name: govulncheck
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      # Scripts, Markdown and workflows are checked as the pre-add gate and
      # the records require (go-core-lib docs/decisions/0003-MADR-remediate-debugging-pass-findings.md D9).
      # shellcheck is pinned to the release the pre-add hosts use (the
      # latest), checksum-verified, and first on PATH so actionlint's
      # embedded checks use it too. The runner's distribution copy is older
      # and reports differently (go-core-lib docs/decisions/0003-PLAN-remediate-debugging-pass-findings.md
      # deviation D5).
      - name: shellcheck, markdownlint, actionlint
        if: runner.os == 'Linux'
        shell: bash
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}:$PATH"
          shellcheck --version
          shellcheck scripts/*.sh
          npx --yes markdownlint-cli2@0.23.2
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
