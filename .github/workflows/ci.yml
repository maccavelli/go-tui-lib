name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# One run per ref: a newer push, or a duplicate trigger for the same one,
# cancels the older run
# (go-selfupdate-lib docs/decisions/0003-MADR-remediate-debugging-pass-findings.md D11).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every gate runs once per module, in the module's directory, with
# GOWORK=off, so that a module builds from its own go.mod and published
# versions only; the tests run once more in workspace mode
# (docs/decisions/0010-MADR-nested-adapter-modules.md §4;
# docs/decisions/0010-PLAN-nested-adapter-modules.md Phase 5). Go comes from
# go.work, and the module cache keys on every module's go.sum.
jobs:
  # The modules go.work lists, checked against the tracked go.mod files,
  # as the test matrix's input.
  modules:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: go-modules.sh, its tests, and --check
        id: list
        shell: bash
        run: |
          ./scripts/go-modules_test.sh
          ./scripts/go-modules.sh --check
          list="$(./scripts/go-modules.sh | jq -R . | jq -cs .)"
          echo "modules: $list"
          echo "list=$list" >>"$GITHUB_OUTPUT"

  test:
    needs: modules
    name: test (${{ matrix.module }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: go mod download
      - run: go test ./...
      # The race detector needs cgo, which the Linux and macOS runners have
      # (go-selfupdate-lib docs/decisions/0003-MADR-remediate-debugging-pass-findings.md D9).
      - name: go test -race
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      # Order-dependent tests fail here (go-selfupdate-lib docs/decisions/0004-MADR-evolve-selfupdate-api-and-tui-support.md H7).
      - name: go test -shuffle
        if: runner.os == 'Linux'
        run: go test -shuffle=on -count=2 ./...
      # Terminal code that assumes a UTF-8 locale fails here
      # (docs/decisions/0001-MADR-scaffold-charm-tui-library.md §5).
      - name: go test LC_ALL=C
        if: runner.os == 'Linux'
        env:
          LC_ALL: C
        run: go test -count=1 ./...
      # Against the tree's other modules: the workspace's build list is the
      # maximum over every module's requirements (0010-MADR §4). An empty
      # GOWORK lets the go command find go.work.
      - name: go test, workspace mode
        env:
          GOWORK: ''
        run: go test -count=1 ./...

  # The gates that loop over the modules themselves, through the Makefile
  # and scripts/go-modules.sh, as `make pre-add-check` does.
  gates:
    needs: modules
    runs-on: ubuntu-24.04
    steps:
      # The whole history and its tags: the API diff gate compares with each
      # module's previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      # Each fuzz target for 20 s; a failing input is kept as an artifact
      # (docs/decisions/0002-PLAN-multi-pane-workspace-layouts.md Step 5,
      # docs/decisions/0006-PLAN-command-registry.md Steps 2 and 4). Only
      # layout, when and command, in the root module, have fuzz targets.
      - name: fuzz
        shell: bash
        env:
          GOWORK: 'off'
        run: |
          ./scripts/go-fuzz_test.sh
          make fuzz
      - name: fuzz corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus
          path: |
            layout/testdata/fuzz/
            when/testdata/fuzz/
            command/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14
      # Targets the matrix does not run: a build-tag gap fails here
      # (go-selfupdate-lib docs/decisions/0004-MADR-evolve-selfupdate-api-and-tui-support.md H7).
      - name: cross go vet
        shell: bash
        run: |
          mods="$(./scripts/go-modules.sh)"
          status=0
          for m in $mods; do
            for target in freebsd/amd64 openbsd/amd64 linux/386; do
              echo "go vet (module $m, $target)"
              (cd "$m" && GOWORK=off CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...) || status=1
            done
          done
          exit "$status"
      # make lint runs make modernize first: go fix -diff for each target
      # fails on any suggestion (docs/decisions/0002-PLAN-harden-workspace-v0-1-1.md Step 7).
      # Each target loops over the modules with GOWORK=off.
      - name: vet, gofmt, tidy, modernize, lint
        run: |
          make vet
          test -z "$(gofmt -l .)"
          make tidy-check
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint" make lint
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          GOVULNCHECK="$(go env GOPATH)/bin/govulncheck" make vuln
      # An incompatible API change since a module's previous tag fails unless
      # scripts/apicheck.allow lists it
      # (docs/decisions/0014-PLAN-api-policy-gates.md Step 4).
      - name: apicheck
        shell: bash
        run: |
          ./scripts/go-apicheck_test.sh
          make apicheck
      # The framework examples build in a temporary module, run as
      # testdata/frameworks/cases.txt says, and match the guides' excerpts
      # (docs/decisions/0014-PLAN-api-policy-gates.md Step 5).
      - name: examples
        shell: bash
        run: |
          ./scripts/go-examples_test.sh
          make examples
      # Scripts, Markdown and workflows are checked as the pre-add gate and
      # the records require (go-selfupdate-lib docs/decisions/0003-MADR-remediate-debugging-pass-findings.md D9).
      # shellcheck is pinned to the release the pre-add hosts use (the
      # latest), checksum-verified, and first on PATH so actionlint's
      # embedded checks use it too. The runner's distribution copy is older
      # and reports differently (go-selfupdate-lib docs/decisions/0003-PLAN-remediate-debugging-pass-findings.md
      # deviation D5).
      - name: shellcheck, markdownlint, actionlint
        shell: bash
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}:$PATH"
          shellcheck --version
          shellcheck scripts/*.sh
          npx --yes markdownlint-cli2@0.23.2
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
