# The checks ci.yml runs on the documents, for a push or pull request
# that changes only them: markdownlint, with ci.yml's command, and the
# guides' excerpt check, the Markdown half of `make examples`. The five
# document patterns below must match ci.yml's paths-ignore, so that a
# change to those files alone runs this workflow instead of the full CI
# (docs/decisions/0019-MADR-skip-full-ci-for-docs-only-pushes.md).
name: Docs
on:
  push:
    branches: [main]
    paths: ['*.md', 'docs/**/*.md', '.claude/**/*.md', '.grok/**/*.md', '.opencode/**/*.md', '.markdownlint-cli2.jsonc', '.github/workflows/docs.yml']
  pull_request:
    paths: ['*.md', 'docs/**/*.md', '.claude/**/*.md', '.grok/**/*.md', '.opencode/**/*.md', '.markdownlint-cli2.jsonc', '.github/workflows/docs.yml']

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The runner image's Node and Python, with no setup action, as in
  # ci.yml; the guide check needs Python 3.12, the runner's.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.23.2
      - name: guide excerpts
        shell: bash
        run: |
          python3 --version
          python3 scripts/go-examples.py --check-guide
